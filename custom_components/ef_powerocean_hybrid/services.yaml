set_battery_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ef_powerocean_hybrid
    mode:
      required: true
      selector:
        select:
          options:
            - automatic
            - hold_battery
            - charge_battery
            - discharge_battery
            - export_to_grid
            - import_from_grid
            - export_solar_first
    power:
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box
    charge_limit_soc:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    expire_in:
      selector:
        number:
          min: 60
          max: 86400
          unit_of_measurement: s
          mode: box
run_control_test:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ef_powerocean_hybrid
    confirm:
      required: true
      selector:
        boolean:
    power:
      default: 1500
      selector:
        number:
          min: 600
          max: 3000
          step: 100
          unit_of_measurement: W
          mode: box
cancel_control_test:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ef_powerocean_hybrid

add_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: ef_powerocean_hybrid
    type:
      required: true
      example: charge
      selector:
        select:
          options:
            - charge
            - use_battery
          translation_key: schedule_type
    power:
      required: true
      example: 3000
      selector:
        number:
          min: 1
          step: 1
          mode: box
          unit_of_measurement: W
    start:
      required: true
      example: "02:00:00"
      selector:
        time:
    end:
      required: true
      example: "06:00:00"
      selector:
        time:
    days:
      example: "[mon, tue, wed, thu, fri]"
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          translation_key: schedule_days
    enabled:
      default: true
      selector:
        boolean:

update_schedule:
  target:
    entity:
      integration: ef_powerocean_hybrid
      domain: switch
  fields:
    type:
      example: charge
      selector:
        select:
          options:
            - charge
            - use_battery
          translation_key: schedule_type
    power:
      example: 3000
      selector:
        number:
          min: 1
          step: 1
          mode: box
          unit_of_measurement: W
    start:
      example: "02:00:00"
      selector:
        time:
    end:
      example: "06:00:00"
      selector:
        time:
    days:
      example: "[mon, tue, wed, thu, fri]"
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          translation_key: schedule_days
    enabled:
      selector:
        boolean:
    daily:
      selector:
        boolean:

delete_schedule:
  target:
    entity:
      integration: ef_powerocean_hybrid
      domain: switch
