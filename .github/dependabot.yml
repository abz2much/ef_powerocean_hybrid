version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Home Assistant pins it (package_constraints.txt), and the integration
      # runs with the version Home Assistant ships, so the tests use that one.
      - dependency-name: paho-mqtt
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Both track a branch, not releases, and run an image that is pulled
      # fresh on every run. Bump their pins by hand if the wrapper changes.
      - dependency-name: hacs/action
      - dependency-name: home-assistant/actions
