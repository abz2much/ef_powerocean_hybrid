version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Home Assistant ships these (package_constraints.txt, and its Modbus
      # integration's requirement), and the integration runs with the versions
      # Home Assistant ships, so the tests use those.
      - dependency-name: paho-mqtt
      - dependency-name: pymodbus
      - dependency-name: modbus-connection
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Both track a branch, not releases, and run an image that is pulled
      # fresh on every run. Bump their pins by hand if the wrapper changes.
      - dependency-name: hacs/action
      - dependency-name: home-assistant/actions
